<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Price_remark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-price_remark" class="form-control editor" rows="5" name="row[price_remark]" cols="50">{$row.price_remark|htmlentities}</textarea>
        </div>
    </div>


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('淘宝返现规则说明')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-taobao_content" class="form-control editor" rows="5" name="row[taobao_content]" cols="50">{$row.taobao_content|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('淘宝返现金额')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-taobao_price" class="form-control" name="row[taobao_price]" type="number" value="{$row.taobao_price|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('分享折扣')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-share_discount" class="form-control" name="row[share_discount]" type="text" value="{$row.share_discount|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('微信二维码')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image" class="form-control" size="50" name="row[image]" type="text" value="{$row.image|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-image" class="btn btn-danger faupload" data-input-id="c-image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-image"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-image" class="btn btn-primary fachoose" data-input-id="c-image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-image"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-image"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Password')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-password" class="form-control" name="row[password]" type="text" value="{$row.password|htmlentities}">
        </div>
    </div>
    
     <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('拼多多口令')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-pdd_password" class="form-control" name="row[pdd_password]" type="text" value="{$row.pdd_password|htmlentities}">
        </div>
    </div>
     <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('淘宝图片')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-taobao_image" class="form-control" size="50" name="row[taobao_image]" type="text" value="{$row.taobao_image|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-taobao_image" class="btn btn-danger faupload" data-input-id="c-taobao_image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-taobao_image"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-taobao_image" class="btn btn-primary fachoose" data-input-id="c-taobao_image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-taobao_image"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-taobao_image"></ul>
        </div>
    </div>
     <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('拼多多图片')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-pdd_image" class="form-control" size="50" name="row[pdd_image]" type="text" value="{$row.pdd_image|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-pdd_image" class="btn btn-danger faupload" data-input-id="c-pdd_image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-pdd_image"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-pdd_image" class="btn btn-primary fachoose" data-input-id="c-pdd_image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-pdd_image"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-pdd_image"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Pay_proportion')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-pay_proportion" class="form-control" name="row[pay_proportion]" type="number" value="{$row.pay_proportion|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Share_proportion')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-share_proportion" class="form-control" name="row[share_proportion]" type="number" value="{$row.share_proportion|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('签约协议')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-agreement_file" class="form-control" size="50" name="row[agreement_file]" type="text" value="{$row.agreement_file|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-agreement_file" class="btn btn-danger faupload" data-input-id="c-agreement_file" data-multiple="false" data-preview-id="p-agreement_file"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-agreement_file" class="btn btn-primary fachoose" data-input-id="c-agreement_file" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-agreement_file"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-agreement_file"></ul>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('签约说明')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-sign_content" class="form-control editor" rows="5" name="row[sign_content]" cols="50">{$row.sign_content|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('弹窗内容')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-taobao_remark" class="form-control" name="row[taobao_remark]" type="text" value="{$row.taobao_remark|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('QQ上传说明')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-qq_content" class="form-control editor" rows="5" name="row[qq_content]" cols="50">{$row.qq_content|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('WPS上传说明')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-wps_content" class="form-control editor" rows="5" name="row[wps_content]" cols="50">{$row.wps_content|htmlentities}</textarea>
        </div>
    </div>


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('效果图')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-rendering" class="form-control" size="50" name="row[rendering]" type="text" value="{$row.rendering|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-rendering" class="btn btn-danger faupload" data-input-id="c-rendering" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-rendering"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-rendering" class="btn btn-primary fachoose" data-input-id="c-rendering" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-rendering"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-rendering"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Create_time')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-create_time" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[create_time]" type="text" value="{:$row.create_time?datetime($row.create_time):''}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
